name: データ更新（日本株）

on:
  schedule:
    # 平日 16:30 JST（東証の引け後）。時刻は UTC で書く
    - cron: "30 7 * * 1-5"
    # 予備（18:30 JST）。1回目が取得元の不調で失敗したときのやり直し。成功済みなら何もしない
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "新しい営業日がなくても作り直す"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: データ取得と判定
        run: python scripts/update.py --market jp ${{ inputs.force && '--force' || '' }}
      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "データ更新: jp $(date -u +%F)"
          git pull --rebase
          git push
