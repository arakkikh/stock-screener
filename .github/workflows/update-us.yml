name: データ更新（米国株）

on:
  schedule:
    # 火〜土 7:30 JST（米国市場の引け後。夏時間・冬時間のどちらでも引け後）。時刻は UTC で書く
    - cron: "30 22 * * 1-5"
    # 予備（9:30 JST）。1回目が取得元の不調で失敗したときのやり直し。成功済みなら何もしない
    - cron: "30 0 * * 2-6"
  workflow_dispatch:
    inputs:
      force:
        description: "新しい営業日がなくても作り直す"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: データ取得と判定（逆張り）
        run: python scripts/update.py --market us --mode contrarian ${{ inputs.force && '--force' || '' }}
      # 順張りは対象が約500銘柄と多い。失敗しても逆張りの結果は保存する
      - name: データ取得と判定（順張り）
        id: momentum
        continue-on-error: true
        run: python scripts/update.py --market us --mode momentum ${{ inputs.force && '--force' || '' }}
      # 保存済みの財務データと最新の株価から、ファンダ分析を計算し直す（通信なし）
      - name: ファンダ分析の再計算
        id: fund
        continue-on-error: true
        run: python scripts/update.py --market us --mode fundamentals
      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "データ更新: us $(date -u +%F)"
          git pull --rebase
          git push
      - name: 順張り・ファンダの更新に失敗していたら知らせる
        if: steps.momentum.outcome == 'failure' || steps.fund.outcome == 'failure'
        run: |
          echo "順張りモードまたはファンダ分析の更新に失敗しました（逆張りは保存済み）"
          exit 1
