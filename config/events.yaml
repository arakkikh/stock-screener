# 自動では取得できない重要イベントの日程。年に1回、公式サイトで確認して書き足す。
#
# 書き方:
#   各イベントの dates に日付（YYYY-MM-DD）を並べる。会合は「結果が発表される日（最終日）」を書く。
#   確認できなかった日程は推測で書かない（空のままにする）。画面に「未登録」と表示される。
#   covered_until には、その日まで日程を確認済みの日付を書く。これを過ぎると画面と通知で知らせる。
#
# 日程が計算で決まるもの（SQ・米国のオプション満期日・日米の休場日）は、このファイルではなく
# 自動で作る（screener/events.py）。決算発表日も毎日のデータ更新で自動取得している。

fomc:
  name: FOMC（米連邦公開市場委員会）
  market: us
  note: 結果の発表は米国東部時間の14時（日本時間では翌日の早朝）
  source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
  checked: 2026-11-15
  covered_until: 2027-12-31
  # 2026年は3・6・9・12月が経済見通し（SEP）つき。2027年は公式ページにまだ SEP の印がない。
  # 公式ページの注記: 各会合の日程は、直前の会合で確定するまで暫定（tentative）
  dates:
