# しきい値の設定ファイル。
# default が共通の値。jp / us に同じ名前で書くと、その市場だけ値を上書きできる。
# 「仮置き」と書いた値は、フェーズ4のバックテストで見直す前提。

default:
  # 移動平均線の期間（日）
  ma:
    short: 5
    mid: 25
    long: 100

  # 市場の温度計
  thermometer:
    fear_greed_max: 20      # Fear & Greed がこの値「未満」
    vol_index_min: 30       # 恐怖指数がこの値「超」（市場ごとに上書き）

  # 買いの条件
  buy:
    drop_pct: -2.5          # 条件1: 前日比がこの値以下（%）
    ma_deviation_pct: -5.0  # 条件2: 25日線からの乖離率がこの値以下（%） 仮置き
    bb_period: 20           # 条件3: ボリンジャーバンドの期間 仮置き
    bb_ddof: 0              # 標準偏差の計算方法（0 = 一般的なチャートソフトと同じ）
    bb_touch: low           # 条件3の「到達」をどの値で見るか（low = 安値が触れたら / close = 終値）
    rci_period: 9           # 条件4: RCI の期間 仮置き
    rci_max: -90            # 条件4: RCI がこの値以下（%）

  # 補助: 25日線を割っても100日線で反発
  ma100_bounce:
    lookback_days: 5        # 直近この日数のうちに100日線へ接近していること 仮置き
    near_pct: 1.0           # 安値が100日線の +この%以内まで来たら「接近」 仮置き

  # 山と谷の見つけ方（前後この日数の中でいちばん安い日を「谷」とする）
  swing:
    window: 3               # 仮置き。谷が確定するのはこの日数が過ぎてから

  # 補助: 1番底が-2σを割り、2番底が-2σの内側で止まる形
  bb_divergence:
    min_gap_days: 5         # 2つの底の間隔（最小） 仮置き
    max_gap_days: 40        # 2つの底の間隔（最大） 仮置き
    min_rebound_pct: 3.0    # 底と底の間で、1番底からこの%以上戻していること 仮置き
    retest_tolerance_pct: 3.0  # 2番底は1番底の +この%以内まで下げていること 仮置き

  # 安値圏・高値圏の定義（過去60日の値幅の中で、終値がどの位置にあるか）
  zone:
    lookback_days: 60       # 仮置き
    low_pct: 25             # 下からこの%以内なら「安値圏」 仮置き
    high_pct: 75            # 下からこの%以上なら「高値圏」 仮置き

  # ローソク足の形
  candle:
    long_body_pct: 1.5      # はらみ線の1本目: 実体（始値と終値の差）がこの%以上 仮置き
    doji_body_ratio: 0.1    # 十字線: 実体が1日の値幅のこの割合以下 仮置き
    hanging_shadow_ratio: 2.0     # 首吊り線: 下ひげが実体のこの倍以上 仮置き
    hanging_upper_max_ratio: 0.15 # 首吊り線: 上ひげが値幅のこの割合以下 仮置き
    window_min_pct: 0.2     # 窓とみなす最小の幅（アイランド・二本黒・並び赤） 仮置き
    similar_body_ratio: 0.5 # 並び赤: 2本の実体の大きさの比がこれ以上なら「同程度」 仮置き

  # 決算・悪材料の後のギャップアップ
  gap_up:
    min_pct: 1.0            # 窓の最小幅（%） 仮置き

  # アイランド（離れ小島）
  island:
    max_days: 10            # 小島の部分の最大日数 仮置き

  # ダブル／トリプルのボトムとトップ
  double:
    similar_pct: 3.0        # 底（天井）どうしの値段の差がこの%以内 仮置き
    min_gap_days: 5         # 底と底の間隔（最小） 仮置き
    max_gap_days: 60        # 底と底の間隔（最大） 仮置き
    min_depth_pct: 3.0      # ネックラインが底からこの%以上離れていること 仮置き
    max_breakout_days: 20   # 最後の底からこの日数以内にネックラインを抜けること 仮置き

  # エントリー候補への昇格
  entry:
    lookback_days: 10       # 買い条件の点灯からこの日数以内に反転サインが出たら昇格 仮置き
    min_conditions: 1       # 必要な買い条件の点灯数 仮置き

  # トレンド継続モード（パーフェクトオーダー）
  trend:
    slope_days: 1           # 線の向き: この日数前より高ければ「上向き」 仮置き
    approach_pct: 1.5       # 5日線と25日線の差がこの%未満なら「接近」 仮置き
    exit_warning_count: 3   # この回数目の接近で「手仕舞い警戒」

  # 画面表示
  display:
    recent_days: 5          # 直近この営業日数のサインを「最近のサイン」として一覧に出す

  # 出口ルール
  exit:
    drop_lookback_days: 10  # 条件1で買ったとき、買った日からこの日数さかのぼって急落日を探す 仮置き

  # 資金管理（年初からの確定損益）
  money:
    warn_remaining_pct: 30  # 確定利益が、年初来の最高額のこの%以下まで減ったら警告 仮置き

  # ------------------------------------------------------------
  # フェーズ2: 順張りモード（ミネルヴィニ式）
  # ------------------------------------------------------------
  momentum:
    # 移動平均線の期間（日）
    ma:
      fast: 50
      mid: 150
      slow: 200

    # トレンドテンプレート（8条件）
    template:
      slow_rising_days: 22    # 条件3: 200日線がこの営業日数前より高ければ「1か月以上上向き」
      year_days: 252          # 52週 = この営業日数
      above_low_pct: 30       # 条件6: 52週安値からこの%以上、上にある
      within_high_pct: 25     # 条件7: 52週高値からこの%以内にある
      rs_min: 70              # 条件8: 相対強度（RS）がこの値以上

    # 相対強度（RS）。期間ごとの騰落率に重みを掛けて合計し、対象銘柄内の順位を1〜99にする
    rs:
      periods: [63, 126, 189, 252]   # 3か月・6か月・9か月・12か月（営業日）
      weights: [2, 1, 1, 1]          # 直近3か月を2倍に重み付け

    # VCP（ボラティリティ収縮パターン）。すべて仮置き
    vcp:
      lookback_days: 120      # この営業日数の中でベース（もみ合い）を探す
      swing_window: 5         # 山の見つけ方（前後この日数でいちばん高い日）
      min_contractions: 2     # 収縮の回数（最小）
      max_contractions: 4     # 収縮の回数（最大）
      max_first_depth_pct: 35 # 最初の押しの深さの上限（%）
      max_last_depth_pct: 10  # 最後の押しの深さの上限（%）
      min_depth_pct: 2        # これより浅い途中の押しは数えない（%）
      shrink_ratio: 1.0       # 押しの深さが「前回 × この値」より小さければ収縮とみなす
      max_high_rise_pct: 3    # 山の高値が前の山よりこの%を超えて高いと、ベースとみなさない
      require_volume_dry: true  # 収縮に合わせて出来高が減っていることを必須にする
      volume_avg_days: 50     # 出来高の平均をとる日数
      breakout_volume_ratio: 1.5  # ブレイクアウト: 出来高が平均のこの倍以上
      breakout_recent_days: 5 # ピボットを上抜けてからこの営業日数は「ブレイクアウト」と表示

    # 順張りの出口ルール
    exit:
      stop_warn_pct: -7       # 買値からこの%で損切りの警告 仮置き
      stop_loss_pct: -8       # 買値からこの%で損切り 仮置き
      ma_break_volume_ratio: 1.5  # 50日線割れの警戒: 出来高が平均のこの倍以上 仮置き

  # ------------------------------------------------------------
  # フェーズ3: ファンダ分析（5軸 × 6項目のチェック）すべて仮置き
  # ------------------------------------------------------------
  fundamentals:
    max_unknown_checks: 3     # 1つの軸で「判定不可」がこの数を超えたら、その軸は点数を付けない
    sector_min_stocks: 3      # セクターの中央値を出すのに必要な銘柄数
    financial_sectors: []     # 銀行・保険など。財務健全性などの一部の項目を判定しない（市場ごとに指定）

    value:                    # 割安度
      peg_max: 1.0            # PEG（PER ÷ 予想EPS成長率）がこの値未満
      fcf_yield_min_pct: 5    # フリーキャッシュフロー利回りがこの%以上
    growth:                   # 成長（アナリスト予想）
      eps_growth_min_pct: 10  # 予想EPS成長率がこの%以上
      revenue_growth_min_pct: 5   # 予想売上成長率がこの%以上
    past:                     # 過去実績
      cagr_years: 3           # EPS成長率を見る年数
      roe_min_pct: 10
      roa_min_pct: 5
    health:                   # 財務健全性
      current_ratio_min: 1.0  # 流動比率（流動資産 ÷ 流動負債）
      debt_to_equity_max: 1.0 # 有利子負債 ÷ 自己資本
      ocf_to_debt_min: 0.2    # 営業キャッシュフロー ÷ 有利子負債
      interest_cover_min: 5   # 利益（EBIT）÷ 支払利息
      equity_ratio_min_pct: 40    # 自己資本比率
    dividend:                 # 配当
      low_quantile: 25        # 配当を出している銘柄の中で、利回りが下からこの%の水準
      high_quantile: 75       # 同じく、上位の水準
      payout_max_pct: 70      # 配当性向の上限
      stable_years: 10        # この年数、減配していないこと・増配していること

  # ------------------------------------------------------------
  # フェーズ4: バックテストの設定（判定のしきい値ではなく、検証のやり方）
  # ------------------------------------------------------------
  backtest:
    years: 10                 # さかのぼる年数
    test_years: 2             # 直近この年数は「確認用」に取っておき、しきい値選びには使わない
    horizons: [5, 10, 20]     # サインの後、何営業日後の成績を見るか（逆張り）
    main_horizon: 10          # しきい値の比較に使う日数
    momentum_horizons: [10, 20, 40]   # 同（順張り）
    max_hold_days: [10, 20, 40]       # 売買シミュレーション: 最大保有日数の候補
    stop_pcts: [null, -5, -8, -10]    # 同: 損切り%の候補（null = 損切りなし）
    momentum_max_hold_days: [20, 40, 60]
    rci_levels: [-70, -80, -90, -95]  # 銘柄ごとに比べる RCI の水準
    rci_min_samples: 10       # 銘柄ごとの最適値を出すのに必要な回数（これ未満は参考外）

jp:
  fundamentals:
    financial_sectors: [銀行業, 保険業, "証券、商品先物取引業", その他金融業]
  thermometer:
    vol_index_min: 50       # 日経VI

us:
  thermometer:
    vol_index_min: 30       # VIX 仮置き
  fundamentals:
    financial_sectors: [Financials]
