# しきい値の設定ファイル。
# default が共通の値。jp / us に同じ名前で書くと、その市場だけ値を上書きできる。
# 「仮置き」と書いた値は、フェーズ4のバックテストで見直す前提。

default:
  # 移動平均線の期間（日）
  ma:
    short: 5
    mid: 25
    long: 100

  # 市場の温度計
  thermometer:
    fear_greed_max: 20      # Fear & Greed がこの値「未満」
    vol_index_min: 30       # 恐怖指数がこの値「超」（市場ごとに上書き）

  # 買いの条件
  buy:
    drop_pct: -2.5          # 条件1: 前日比がこの値以下（%）
    ma_deviation_pct: -5.0  # 条件2: 25日線からの乖離率がこの値以下（%） 仮置き
    bb_period: 20           # 条件3: ボリンジャーバンドの期間 仮置き
    bb_ddof: 0              # 標準偏差の計算方法（0 = 一般的なチャートソフトと同じ）
    bb_touch: low           # 条件3の「到達」をどの値で見るか（low = 安値が触れたら / close = 終値）
    rci_period: 9           # 条件4: RCI の期間 仮置き
    rci_max: -90            # 条件4: RCI がこの値以下（%）

  # 補助: 25日線を割っても100日線で反発
  ma100_bounce:
    lookback_days: 5        # 直近この日数のうちに100日線へ接近していること 仮置き
    near_pct: 1.0           # 安値が100日線の +この%以内まで来たら「接近」 仮置き

  # 山と谷の見つけ方（前後この日数の中でいちばん安い日を「谷」とする）
  swing:
    window: 3               # 仮置き。谷が確定するのはこの日数が過ぎてから

  # 補助: 1番底が-2σを割り、2番底が-2σの内側で止まる形
  bb_divergence:
    min_gap_days: 5         # 2つの底の間隔（最小） 仮置き
    max_gap_days: 40        # 2つの底の間隔（最大） 仮置き
    min_rebound_pct: 3.0    # 底と底の間で、1番底からこの%以上戻していること 仮置き
    retest_tolerance_pct: 3.0  # 2番底は1番底の +この%以内まで下げていること 仮置き

  # 安値圏・高値圏の定義（過去60日の値幅の中で、終値がどの位置にあるか）
  zone:
    lookback_days: 60       # 仮置き
    low_pct: 25             # 下からこの%以内なら「安値圏」 仮置き
    high_pct: 75            # 下からこの%以上なら「高値圏」 仮置き

  # ローソク足の形
  candle:
    long_body_pct: 1.5      # はらみ線の1本目: 実体（始値と終値の差）がこの%以上 仮置き
    doji_body_ratio: 0.1    # 十字線: 実体が1日の値幅のこの割合以下 仮置き
    hanging_shadow_ratio: 2.0     # 首吊り線: 下ひげが実体のこの倍以上 仮置き
    hanging_upper_max_ratio: 0.15 # 首吊り線: 上ひげが値幅のこの割合以下 仮置き
    window_min_pct: 0.2     # 窓とみなす最小の幅（アイランド・二本黒・並び赤） 仮置き
    similar_body_ratio: 0.5 # 並び赤: 2本の実体の大きさの比がこれ以上なら「同程度」 仮置き

  # 決算・悪材料の後のギャップアップ
  gap_up:
    min_pct: 1.0            # 窓の最小幅（%） 仮置き

  # アイランド（離れ小島）
  island:
    max_days: 10            # 小島の部分の最大日数 仮置き

  # ダブル／トリプルのボトムとトップ
  double:
    similar_pct: 3.0        # 底（天井）どうしの値段の差がこの%以内 仮置き
    min_gap_days: 5         # 底と底の間隔（最小） 仮置き
    max_gap_days: 60        # 底と底の間隔（最大） 仮置き
    min_depth_pct: 3.0      # ネックラインが底からこの%以上離れていること 仮置き
    max_breakout_days: 20   # 最後の底からこの日数以内にネックラインを抜けること 仮置き

  # エントリー候補への昇格
  entry:
    lookback_days: 10       # 買い条件の点灯からこの日数以内に反転サインが出たら昇格 仮置き
    min_conditions: 1       # 必要な買い条件の点灯数 仮置き

  # トレンド継続モード（パーフェクトオーダー）
  trend:
    slope_days: 1           # 線の向き: この日数前より高ければ「上向き」 仮置き
    approach_pct: 1.5       # 5日線と25日線の差がこの%未満なら「接近」 仮置き
    exit_warning_count: 3   # この回数目の接近で「手仕舞い警戒」

  # 画面表示
  display:
    recent_days: 5          # 直近この営業日数のサインを「最近のサイン」として一覧に出す

  # 出口ルール
  exit:
    drop_lookback_days: 10  # 条件1で買ったとき、買った日からこの日数さかのぼって急落日を探す 仮置き

  # 資金管理（年初からの確定損益）
  money:
    warn_remaining_pct: 30  # 確定利益が、年初来の最高額のこの%以下まで減ったら警告 仮置き

jp:
  thermometer:
    vol_index_min: 50       # 日経VI

us:
  thermometer:
    vol_index_min: 30       # VIX 仮置き
